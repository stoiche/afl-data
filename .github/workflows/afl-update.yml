# Save as .github/workflows/afl-update.yml in a PUBLIC GitHub repo that also
# contains update_afl_data.R, fetch_weather.py, build_h2h_json.py,
# fetch_upcoming.R, predict.py and afl_player_games_2015_2026.csv.
#
# Each run: re-scrapes the current season from AFL Tables, rewrites the master
# CSV, tops up weather_cache.json with match-time weather for any new games,
# rebuilds h2h_compact.json, fetches the next round's fixture and lineups, rebuilds
# the tips in predictions.json, and commits whatever changed. The app fetches both
# JSON files, so a successful run is all it takes for the app to show new results.

name: AFL data update

on:
  schedule:
    # Twice daily, 07:00 and 19:00 Melbourne time (approx - GitHub runs on UTC
    # and ignores Australian DST, so these drift an hour across the year, which
    # doesn't matter for a job that runs every day anyway).
    - cron: '0 21 * * *'
    - cron: '0 9  * * *'
  workflow_dispatch:          # run it by hand from the Actions tab

# Needed for the bot to push back to the repo.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::fitzRoy
            any::dplyr
            any::readr

      - name: Refresh current season
        run: Rscript update_afl_data.R afl_player_games_2015_2026.csv

      - name: Fetch match weather
        # Stdlib only. Only uncached games are fetched, and a weather failure
        # must never block the stats update - hence continue-on-error.
        continue-on-error: true
        run: python3 fetch_weather.py afl_player_games_2015_2026.csv weather_cache.json

      - name: Rebuild the app's data file
        # Stdlib only, so no pip install step. Fails loudly if match grouping
        # breaks, which stops a corrupt JSON reaching the app.
        run: python3 build_h2h_json.py afl_player_games_2015_2026.csv h2h_compact.json

      - name: Fetch next round's fixture and lineups
        # Writes a header-only upcoming.csv and exits 0 on any failure; the
        # continue-on-error is a second safety net. Tips must never block stats.
        continue-on-error: true
        run: Rscript fetch_upcoming.R upcoming.csv

      - name: Build tips
        # Stdlib only. Imports fetch_weather.py for the venue list and labels.
        continue-on-error: true
        run: python3 predict.py afl_player_games_2015_2026.csv weather_cache.json upcoming.csv predictions.json

      - name: Commit if anything changed
        run: |
          git config user.name  "afl-data-bot"
          git config user.email "afl-data-bot@users.noreply.github.com"
          rm -f afl_player_games_2015_2026.csv.bak weather_cache.json.tmp predictions.json.tmp

          # Stage one at a time: weather_cache.json, upcoming.csv and
          # predictions.json are untracked on their first run, and a plain
          # "git diff" can't see untracked files. -f gets past a .gitignore that
          # would otherwise make "git add" fail and kill the step.
          for f in afl_player_games_2015_2026.csv h2h_compact.json \
                   weather_cache.json upcoming.csv predictions.json; do
            if [ -f "$f" ]; then
              git add -f -- "$f" || echo "warning: could not stage $f"
            else
              echo "note: $f was not produced this run"
            fi
          done

          if git diff --cached --quiet; then
            echo "No new results."
            exit 0
          fi
          git status --short
          git commit -m "AFL data refresh $(date +'%Y-%m-%d %H:%M')"

          # The push is rejected if anything landed on the branch while this job
          # was running (your own commits, or an overlapping scheduled run), so
          # rebase onto whatever is there now and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push attempt $attempt was rejected - rebasing on origin/$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
          done
          echo "Push failed three times."
          exit 1
